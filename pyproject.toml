[project]
name = "agent-identity-guard"
version = "0.1.0"
description = "Audit GitHub Actions workflows and git history for agent/bot identity and supply-chain risk"
readme = "README.md"
authors = [
    { name = "Palak-Pathak", email = "palakpathak1912@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "gitpython>=3.1.62",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
agent-identity-guard = "agent_guard.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "agent_guard"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12.20260906",
]
